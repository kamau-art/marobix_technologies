services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    image: marobix-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # Inside the compose network the DB host is "db" and Postgres listens on its
      # default port 5432 (the host-side publish below is a separate mapping).
      - DATABASE_URL=postgres://${POSTGRES_USER:-marobix}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marobix}
    ports:
      # Host nginx owns 80/443 (Let's Encrypt) and proxies to this loopback port.
      # Keep this in sync with your nginx proxy_pass (see DEPLOY.md 6b/6c).
      - "127.0.0.1:8080:3000"
    volumes:
      - next-cache:/app/.next/cache
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marobix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-marobix}
    ports:
      # HOST:CONTAINER. Postgres listens on 5432 inside the container; published on
      # host port 5403, loopback-only. Optional on the server — the app talks to db
      # over the internal network, not via this publish.
      - "127.0.0.1:5403:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  next-cache:
  pgdata:
