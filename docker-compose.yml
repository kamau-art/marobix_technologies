services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    image: marobix-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # Inside the compose network the DB host is "db" (not localhost, which .env uses for local dev)
      - DATABASE_URL=postgres://${POSTGRES_USER:-marobix}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marobix}
    ports:
      # Production: host nginx owns 80/443 (Let's Encrypt) and proxies to this loopback port.
      # Bind to loopback so the app is never exposed directly.
      - "127.0.0.1:3000:3000"
    volumes:
      - next-cache:/app/.next/cache
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marobix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-marobix}
    ports:
      # Published as 5433 because another Postgres already uses host port 5432.
      # Lets the local dev server (npm run dev) reach Postgres at localhost:5433.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  next-cache:
  pgdata:
